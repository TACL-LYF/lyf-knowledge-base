# Template for config.yaml. Copy it:  cp config.example.yaml config.yaml
# config.yaml is gitignored. Secrets go in .env, not here.

discord:
  server_id: "" # Turn on developer mode → right-click the server icon → Copy Server ID
  channel_id: "" # Turn on developer mode → right-click the feedback channel → Copy Channel ID

drive:
  source_folder_ids: # folders with existing feedback (service account: Viewer)
    - "" # one folder ID per line; subfolders are read too
  kb_folder_id: "" # Knowledge Base folder in a Shared Drive (service account: Content manager)
  file_types: # Google file types read from the source folders
    - application/vnd.google-apps.document
    - application/vnd.google-apps.spreadsheet
    - application/vnd.google-apps.presentation
  allow_large_files: [] # file IDs to extract even when over llm.max_item_tokens
  export_workers: 8 # files exported (and folders listed) at once; 1 for one at a time

llm: # see "Choosing models" in docs/PLAN.md
  extract_model: claude-opus-5-5 # turns each item into records; mistakes are saved for good
  synthesis_model: claude-opus-5-5 # builds the docs every run; can be switched to a cheaper model
  # extract_effort: high # low | medium | high | xhigh | max; leave out for the model's default
  max_item_tokens: 100000 # larger items (characters ÷ 4) are skipped and reported
  batch_min_requests: 20 # this many extraction requests or more go through the Batch API (half price)

programming:
  per_session_types: # types where each session has its own content; records name the session
    - Workshop

state:
  lock_timeout_minutes: 60 # a lock older than this is treated as stale

paths:
  data_dir: data # local cache (gitignored)
